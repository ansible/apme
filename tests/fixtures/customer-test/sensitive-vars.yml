---
# Demonstrates M031: register_secret recommendation for ansible-core 2.22+
# Run: apme check tests/fixtures/customer-test/sensitive-vars.yml

- name: M031 register_secret Demonstration
  hosts: localhost
  gather_facts: false

  tasks:
    # --- SHOULD TRIGGER M031 ---

    # set_fact with sensitive variable names
    - name: Store database password (triggers M031)
      ansible.builtin.set_fact:
        db_password: "{{ vault_db_pass }}"

    - name: Store API credentials (triggers M031)
      ansible.builtin.set_fact:
        api_token: "{{ lookup('env', 'API_TOKEN') }}"
        client_secret: "{{ vault_client_secret }}"

    # register to sensitive variable names
    - name: Fetch secret from vault (triggers M031)
      ansible.builtin.uri:
        url: "https://vault.example.com/v1/secret/data/app"
        headers:
          X-Vault-Token: "{{ vault_token }}"
      register: api_key_response

    - name: Get SSH key (triggers M031)
      ansible.builtin.slurp:
        src: /home/deploy/.ssh/id_rsa
      register: private_key_content

    # Task-level no_log hides this result, but does not register the fact
    # for masking when a later task uses it.
    - name: Store password with no_log (still triggers M031)
      ansible.builtin.set_fact:
        admin_password: "{{ vault_admin_pass }}"
      no_log: true

    # --- SHOULD NOT TRIGGER M031 ---

    # Explicitly registering a value is recognized even if its source may
    # already be registered automatically (for example, a vaulted variable).
    - name: Store token with register_secret (no M031)
      ansible.builtin.set_fact:
        bearer_token: "{{ vault_bearer | ansible.builtin.register_secret }}"

    # A register projection extracts the secret string from the module result.
    - name: Register token from API response (no M031)
      ansible.builtin.uri:
        url: https://example.com/token
        return_content: true
      register:
        api_token: _task.result.json.token | ansible.builtin.register_secret
        task_result: _task.result
      no_log: true

    # Non-sensitive variable names
    - name: Store regular config (no M031 - not sensitive)
      ansible.builtin.set_fact:
        app_config:
          timeout: 30
          retries: 3

    - name: Get file content (no M031 - not sensitive name)
      ansible.builtin.slurp:
        src: /etc/app/config.yml
      register: config_content
