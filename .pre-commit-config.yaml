repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--strict, src/, tests/, scripts/]
        pass_filenames: false
        additional_dependencies:
          - packaging>=26.2
          - types-protobuf
          - types-PyYAML
          - grpc-stubs
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.1
    hooks:
      - id: uv-lock
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint
        args: [--exclude=src/apme/v1/, src/, tests/, scripts/]
        pass_filenames: false
  - repo: https://github.com/michellepellon/skillmark
    rev: v0.1.0
    hooks:
      - id: skillmark
        language: rust
        args: [--config, .skillmark.toml]
      - id: skillmark-fix
        language: rust
        args: [--config, .skillmark.toml]
        stages: [manual]
  - repo: local
    hooks:
      - id: adr-index
        name: adr-index
        language: python
        language_version: python3.12
        entry: python scripts/generate_adr_index.py
        files: ^\.sdlc/adrs/ADR-.*\.md$
        pass_filenames: false
      - id: rule-catalog
        name: rule-catalog
        language: python
        language_version: python3.12
        entry: python tools/generate_rule_catalog.py
        additional_dependencies: [pyyaml]
        files: ^src/apme_engine/(validators|graph/rules)/.+\.(py|rego|md)$|^src/apme_engine/remediation/transforms/|^tools/(generate_rule_catalog|rule_analysis)\.py$|^src/apme_engine/graph/severity\.py$|^src/apme_engine/remediation/partition\.py$
        pass_filenames: false
      - id: graph-boundary
        name: graph-boundary (ADR-059)
        language: python
        language_version: python3.12
        entry: python tools/check_graph_boundary.py
        files: ^src/apme_engine/graph/.+\.py$
        pass_filenames: false
      - id: check-skill-frontmatter
        name: Validate SKILL.md frontmatter
        language: python
        language_version: python3.12
        entry: python scripts/check_skill_frontmatter.py
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
      - id: openapi-check
        name: openapi-check (Gateway OpenAPI v1)
        language: system
        entry: bash -c 'uvx --with tox-uv tox -e openapi -- --check'
        files: ^(src/apme_gateway/(api/|app\.py$)|docs/api/openapi\.v1\.json$|scripts/export_openapi\.py$|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
