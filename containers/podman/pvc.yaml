# Podman named volumes for local development (same PVC shape as the operator deployment).
# Applied by containers/podman/up.sh before pod.yaml. For Kubernetes/OpenShift,
# use the APME Operator (ansible/apme-operator), which defines its own PVCs.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apme-sessions
  annotations:
    volume.podman.io/uid: "1001"
    volume.podman.io/gid: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apme-postgres-data
  annotations:
    volume.podman.io/uid: "999"
    volume.podman.io/gid: "999"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apme-proxy-cache
  annotations:
    volume.podman.io/uid: "1001"
    volume.podman.io/gid: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
