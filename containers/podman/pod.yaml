# Podman pod: Engine, Native, OPA, Ansible, Gitleaks, Collection Health,
# Dep Audit, Galaxy Proxy, Gateway, UI, Abbenay, OTel Collector.
# All validators implement the unified Validator gRPC service (validate.proto).
# Galaxy Proxy serves collections as Python wheels via PEP 503 (ADR-031).
# Session venvs are built by Engine (read-write) and shared with validators
# (read-only) via the sessions volume.
# OTel Collector receives OTLP from sibling containers and exposes Prometheus
# metrics on :8889 for an external Prometheus scrape.
# CLI is run on-the-fly with: ./run-cli.sh [args]
# Start from repo root: podman play kube pod.yaml
# Requires: images built first (./build.sh). PVCs are created from pvc.yaml on start.
apiVersion: v1
kind: Pod
metadata:
  name: apme-pod
  labels:
    app: apme
spec:
  hostname: apme-pod
  containers:
    - name: engine
      image: apme-engine:latest
      env:
        - name: APME_ENGINE_LISTEN
          value: "0.0.0.0:50051"
        - name: NATIVE_GRPC_ADDRESS
          value: "127.0.0.1:50055"
        - name: OPA_GRPC_ADDRESS
          value: "127.0.0.1:50054"
        - name: ANSIBLE_GRPC_ADDRESS
          value: "127.0.0.1:50053"
        - name: GITLEAKS_GRPC_ADDRESS
          value: "127.0.0.1:50056"
        - name: COLLECTION_HEALTH_GRPC_ADDRESS
          value: "127.0.0.1:50058"
        - name: DEP_AUDIT_GRPC_ADDRESS
          value: "127.0.0.1:50059"
        - name: APME_GALAXY_PROXY_URL
          value: "http://127.0.0.1:8765"
        - name: APME_REPORTING_ENDPOINT
          value: "127.0.0.1:50060"
        - name: APME_ABBENAY_ADDR
          value: "127.0.0.1:50057"
        - name: APME_ABBENAY_TOKEN
          value: "apme-dev-token"
        - name: APME_AI_MODEL
          value: "${APME_AI_MODEL}"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-engine"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50051
          hostPort: 50051
      volumeMounts:
        - name: sessions
          mountPath: /sessions
    - name: native
      image: apme-native:latest
      env:
        - name: APME_NATIVE_VALIDATOR_LISTEN
          value: "0.0.0.0:50055"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-native"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50055
          hostPort: 50055
    - name: opa
      image: apme-opa:latest
      env:
        - name: APME_OPA_VALIDATOR_LISTEN
          value: "0.0.0.0:50054"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-opa"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50054
          hostPort: 50054
    - name: ansible
      image: apme-ansible:latest
      env:
        - name: APME_ANSIBLE_VALIDATOR_LISTEN
          value: "0.0.0.0:50053"
        - name: APME_GALAXY_PROXY_URL
          value: "http://127.0.0.1:8765"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-ansible"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50053
          hostPort: 50053
      volumeMounts:
        - name: sessions
          mountPath: /sessions
          readOnly: true
    - name: gitleaks
      image: apme-gitleaks:latest
      env:
        - name: APME_GITLEAKS_VALIDATOR_LISTEN
          value: "0.0.0.0:50056"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-gitleaks"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50056
          hostPort: 50056
    - name: collection-health
      image: apme-collection-health:latest
      env:
        - name: APME_COLLECTION_HEALTH_VALIDATOR_LISTEN
          value: "0.0.0.0:50058"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-collection-health"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50058
          hostPort: 50058
      volumeMounts:
        - name: sessions
          mountPath: /sessions
          readOnly: true
    - name: dep-audit
      image: apme-dep-audit:latest
      env:
        - name: APME_DEP_AUDIT_VALIDATOR_LISTEN
          value: "0.0.0.0:50059"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-dep-audit"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50059
          hostPort: 50059
      volumeMounts:
        - name: sessions
          mountPath: /sessions
          readOnly: true
    - name: postgres
      image: docker.io/library/postgres:16
      env:
        - name: POSTGRES_USER
          value: "apme"
        - name: POSTGRES_PASSWORD
          value: "apme"
        - name: POSTGRES_DB
          value: "apme"
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: gateway-data
          mountPath: /var/lib/postgresql/data
    - name: gateway
      image: apme-gateway:latest
      env:
        - name: APME_DATABASE_URL
          value: "postgresql+asyncpg://apme:apme@127.0.0.1:5432/apme"
        - name: APME_GATEWAY_GRPC_LISTEN
          value: "0.0.0.0:50060"
        - name: APME_GATEWAY_HTTP_HOST
          value: "0.0.0.0"
        - name: APME_GATEWAY_HTTP_PORT
          value: "8080"
        - name: APME_ABBENAY_HTTP_URL
          value: "http://127.0.0.1:8787"
        - name: APME_ABBENAY_HTTP_TOKEN
          value: "apme-dev-token"
        - name: COLLECTION_HEALTH_GRPC_ADDRESS
          value: "127.0.0.1:50058"
        - name: DEP_AUDIT_GRPC_ADDRESS
          value: "127.0.0.1:50059"
        - name: APME_FEEDBACK_ENABLED
          value: "${APME_FEEDBACK_ENABLED}"
        - name: APME_FEEDBACK_GITHUB_REPO
          value: "${APME_FEEDBACK_GITHUB_REPO}"
        - name: APME_FEEDBACK_GITHUB_TOKEN
          value: "${APME_FEEDBACK_GITHUB_TOKEN}"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-gateway"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 50060
          hostPort: 50060
        - containerPort: 8080
          hostPort: 8080
    - name: ui
      image: apme-ui:latest
      ports:
        - containerPort: 8081
          hostPort: 8081
    - name: abbenay
      image: ghcr.io/redhat-developer/abbenay:v2026.8.6
      # ADR-070: HTTP + gRPC on loopback (pod-shared netns). No hostPort for
      # Abbenay — matches Helm Simple and avoids plaintext host exposure.
      args:
        - "web"
        - "--host"
        - "127.0.0.1"
        - "--port"
        - "8787"
        - "--grpc-host"
        - "127.0.0.1"
        - "--grpc-port"
        - "50057"
      env:
        - name: OPENROUTER_API_KEY
          value: "${OPENROUTER_API_KEY}"
        - name: VERTEX_ANTHROPIC_API_KEY
          value: "${VERTEX_ANTHROPIC_API_KEY}"
        - name: APME_ABBENAY_TOKEN
          value: "apme-dev-token"
        - name: ABBENAY_API_TOKEN
          value: "apme-dev-token"
        - name: XDG_RUNTIME_DIR
          value: "/tmp/abbenay-run"
        - name: XDG_CONFIG_HOME
          value: "/home/abbenay/.config"
      ports:
        - containerPort: 50057
          # no hostPort
      volumeMounts:
        - name: abbenay-config
          mountPath: /home/abbenay/.config/abbenay
    - name: galaxy-proxy
      image: apme-galaxy-proxy:latest
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4318"
        - name: OTEL_SERVICE_NAME
          value: "apme-galaxy-proxy"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=apme,service.instance.id=apme-pod"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
      ports:
        - containerPort: 8765
          hostPort: 8765
      volumeMounts:
        - name: proxy-cache
          mountPath: /cache
    - name: otel-collector
      image: docker.io/otel/opentelemetry-collector-contrib:0.120.0
      args: ["--config=/etc/otelcol/config.yaml"]
      ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 8889
          hostPort: 8889
      volumeMounts:
        - name: otel-config
          mountPath: /etc/otelcol/config.yaml
          readOnly: true
  volumes:
    - name: gateway-data
      persistentVolumeClaim:
        claimName: apme-gateway-data
    - name: sessions
      persistentVolumeClaim:
        claimName: apme-sessions
    - name: proxy-cache
      persistentVolumeClaim:
        claimName: apme-proxy-cache
    - name: abbenay-config
      hostPath:
        path: ${APME_ROOT}/containers/abbenay/config
        type: Directory
    - name: otel-config
      hostPath:
        path: ${APME_ROOT}/containers/otel-collector/config.yaml
        type: File