version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  # Updates .pre-commit-config.yaml only — Dependabot cannot edit prek.toml yet
  # (dependabot/dependabot-core#14624). CI runs prek.toml; after these PRs sync with:
  #   python scripts/prek_config_revs.py sync --direction yaml-to-toml
  # The prek-config-revs hook fails until shared remote revs match.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
