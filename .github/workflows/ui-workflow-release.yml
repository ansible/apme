# Attach client/workflow/Backstage tarballs to the main release (ADR-066/073).
# Runs after a GitHub Release is published; derives version from the tag.
name: UI package artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ui-workflow-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attach-tarball:
    if: >-
      startsWith(github.event.release.tag_name, 'v')
      && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Derive version from tag
        id: ver
        run: |
          set -euo pipefail
          VERSION="${GITHUB_EVENT_RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vX.Y.Z format: ${GITHUB_EVENT_RELEASE_TAG}"
            exit 1
          fi
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Verify standard packages
        run: uvx --with-requirements ci/tox-requirements.txt tox -e frontend-ci,frontend-build,frontend-lint,frontend-unit

      - name: Pack immutable release artifacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: uvx --with-requirements ci/tox-requirements.txt tox -e frontend-pack -- --version "${VERSION}"

      - name: Upload packages and checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/ui-packages/*.tgz dist/ui-packages/SHA256SUMS dist/ui-packages/manifest.json
