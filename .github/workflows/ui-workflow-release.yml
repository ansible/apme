# Attach generated assets to the main APME release.
# Runs after a GitHub Release is published; derives versions from the tag.
name: APME release assets

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attach-tarball:
    if: >-
      startsWith(github.event.release.tag_name, 'v')
      && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Derive version from tag
        id: ver
        run: |
          set -euo pipefail
          VERSION="${GITHUB_EVENT_RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use vX.Y.Z format: ${GITHUB_EVENT_RELEASE_TAG}"
            exit 1
          fi
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'tarball=apme-ui-workflow-%s.tgz\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Stamp version into package.json
        working-directory: frontend/packages/ui-workflow
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version

      - name: npm pack (runs prepack → tsc + CSS copy)
        working-directory: frontend
        run: npm pack ./packages/ui-workflow

      - name: Upload tarball to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ steps.ver.outputs.tarball }}
        run: gh release upload --clobber "${TAG}" "frontend/${TARBALL}"

  attach-bootc-quadlet-overlay:
    if: >-
      startsWith(github.event.release.tag_name, 'v')
      && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Buildx and GHCR login are required to inspect merged release manifests.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version from release tag
        id: release-version
        env:
          GITHUB_EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${GITHUB_EVENT_RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use vX.Y.Z format: ${GITHUB_EVENT_RELEASE_TAG}"
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Wait for release image manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: deploy/bootc/wait-for-container-images.sh "${TAG}"

      - name: Render digest-pinned Quadlets
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
          GITHUB_EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/apme-bootc-quadlets"
          python3 deploy/bootc/render-quadlet-pins.py \
            --version "${VERSION}" \
            --output-dir "${output_dir}"
          tar -C "${output_dir}" -czf \
            "${RUNNER_TEMP}/apme-bootc-quadlets-${GITHUB_EVENT_RELEASE_TAG}.tar.gz" .

      - name: Upload digest-pinned Quadlets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ runner.temp }}/apme-bootc-quadlets-${{ github.event.release.tag_name }}.tar.gz
        run: gh release upload --clobber "${TAG}" "${ASSET}"
