# Publish the Helm chart to a classic HTTP chart repository (GitHub Pages).
# OpenShift Developer Catalog / HelmChartRepository consume index.yaml from
# https://ansible.github.io/apme (requires Pages enabled on the gh-pages branch).
name: Helm Charts

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/apme/**"
      - ".github/workflows/helm-charts.yml"
      - "scripts/helm_chart.sh"
      - "scripts/publish_helm_values_profiles.sh"
      - "ci/helm-publish-requirements.txt"
      - "tox.ini"
  pull_request:
    paths:
      - "deploy/helm/apme/**"
      - ".github/workflows/helm-charts.yml"
      - "scripts/helm_chart.sh"
      - "scripts/publish_helm_values_profiles.sh"
      - "ci/helm-publish-requirements.txt"
      - "tox.ini"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v7

      - name: Lint and package chart
        run: uvx --with tox-uv tox -e helm

  release:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: helm-charts-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v7

      - name: Configure Git user.name
        run: git config user.name "$GITHUB_ACTOR"

      - name: Configure Git user.email
        run: git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: deploy/helm
          skip_existing: "true"
          mark_as_latest: "false"
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chart-releaser only maintains index.yaml (+ release .tgz). Publish the
      # named values profiles as loose files on Pages so operators can:
      #   helm install … -f https://ansible.github.io/apme/values-portal.yaml
      # Toolchain pins live in ci/helm-publish-requirements.txt (not YAML).
      # uvx ignores uv.lock; this job has contents: write.
      - name: Publish values profiles to GitHub Pages
        run: >-
          uvx --with-requirements ci/helm-publish-requirements.txt
          tox -e helm-pages-profiles
        env:
          HELM_PAGES_PUSH: "1"
          HELM_PAGES_REMOTE: origin
