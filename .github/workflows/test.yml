---
name: test

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PY_COLORS: 1
  APME_TEST_DATABASE_URL: postgresql+asyncpg://apme:apme@localhost:5432/apme_test

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apme
          POSTGRES_PASSWORD: apme
          POSTGRES_DB: apme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apme -d apme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx --with tox-uv tox -e unit
      - name: Fail if git reports dirty
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "::error::Git reports modified/untracked files after test run"
            git status -s
            exit 1
          fi

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apme
          POSTGRES_PASSWORD: apme
          POSTGRES_DB: apme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apme -d apme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install OPA binary
        env:
          OPA_VERSION: "1.17.1"
          OPA_SHA256: "3d4bb88482958d990351ec5d2f7558509992776bc473bc1b78d86d76cb993ca3"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/opa_linux_amd64_static \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /tmp/opa_linux_amd64_static" | sha256sum --check -
          sudo install -m 755 /tmp/opa_linux_amd64_static /usr/local/bin/opa
          opa version
      - name: Verify PostgreSQL reachability
        run: uvx --with tox-uv tox -e postgres-check
      - run: uvx --with tox-uv tox -e integration
        env:
          OPA_USE_PODMAN: "0"
      - name: Integration (OPA Podman path)
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "podman not available on runner; skipping Podman-path OPA leg"
            echo "::warning title=OPA-Podman-leg::skipped: no podman on runner, production Podman transport uncovered on this run"
            echo "## OPA Podman leg skipped — no podman on runner" >> "$GITHUB_STEP_SUMMARY"
            echo "Production defaults to OPA_USE_PODMAN=1; this run exercised only the local-binary path." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uvx --with tox-uv tox -e integration
        env:
          OPA_USE_PODMAN: "1"

  ui:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apme
          POSTGRES_PASSWORD: apme
          POSTGRES_DB: apme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apme -d apme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OPA binary
        env:
          OPA_VERSION: "1.17.1"
          OPA_SHA256: "3d4bb88482958d990351ec5d2f7558509992776bc473bc1b78d86d76cb993ca3"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/opa_linux_amd64_static \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /tmp/opa_linux_amd64_static" | sha256sum --check -
          sudo install -m 755 /tmp/opa_linux_amd64_static /usr/local/bin/opa
      - name: Build and serve UI
        run: |
          cd frontend && npm ci && npm run build && cd ..
          uv run python -m apme_gateway.main &
          npx serve frontend/dist -l 8081 -s &
          sleep 3
        env:
          APME_DATABASE_URL: postgresql+asyncpg://apme:apme@localhost:5432/apme_test
          APME_GATEWAY_GRPC_LISTEN: 127.0.0.1:50060
          APME_GATEWAY_HTTP_HOST: 127.0.0.1
          APME_GATEWAY_HTTP_PORT: 8080
      - run: uvx --with tox-uv tox -e ui
        env:
          APME_UI_URL: http://localhost:8081
          APME_DATABASE_URL: postgresql+asyncpg://apme:apme@localhost:5432/apme_test
          APME_GATEWAY_HTTP_HOST: 127.0.0.1
          APME_GATEWAY_HTTP_PORT: 8080

  test-ai-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx --with tox-uv tox -e ai

  ui-workflow-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # npm pack: same setup-node exception as the ui job; version from engines.node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uvx --with tox-uv tox -e ui-workflow-pack
