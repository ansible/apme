---
name: test

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
      - run: uvx --with tox-uv tox -e unit
      - name: Fail if git reports dirty
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "::error::Git reports modified/untracked files after test run"
            git status -s
            exit 1
          fi

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
      - name: Install OPA binary
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: uvx --with tox-uv tox -e integration
        env:
          OPA_USE_PODMAN: "0"
      - name: Retry integration on timeout
        if: failure()
        run: uvx --with tox-uv tox -e integration
        env:
          OPA_USE_PODMAN: "0"

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OPA binary
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: Build and serve UI
        run: |
          cd frontend && npm ci && npm run build && cd ..
          uv run python -m apme_gateway.main &
          npx serve frontend/dist -l 8081 -s &
          sleep 3
        env:
          APME_DB_PATH: /tmp/apme-ui-test.db
          APME_GATEWAY_GRPC_LISTEN: 127.0.0.1:50060
          APME_GATEWAY_HTTP_HOST: 127.0.0.1
          APME_GATEWAY_HTTP_PORT: 8080
      - run: uvx --with tox-uv tox -e ui
        env:
          APME_UI_URL: http://localhost:8081
          APME_DB_PATH: /tmp/apme-ui-test.db
          APME_GATEWAY_HTTP_HOST: 127.0.0.1
          APME_GATEWAY_HTTP_PORT: 8080

  test-ai-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
      - run: uvx --with tox-uv tox -e ai
