---
name: test

on:
  pull_request:
    branches: [main, "feat/ui-split-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PY_COLORS: 1
  APME_TEST_DATABASE_URL: postgresql+asyncpg://apme:apme@localhost:5432/apme_test

# Use Google's public Docker Hub cache to avoid anonymous Hub pull limits.
# Keep the PostgreSQL 16 index digest identical across all service jobs.

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: apme
          POSTGRES_PASSWORD: apme
          POSTGRES_DB: apme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apme -d apme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx --with-requirements ci/tox-requirements.txt tox -e unit
      - name: Fail if git reports dirty
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "::error::Git reports modified/untracked files after test run"
            git status -s
            exit 1
          fi

  integration-matrix:
    runs-on: ubuntu-24.04
    # Each OPA transport runs on a fresh runner: the daemon binds fixed
    # ports, so consecutive integration runs on one machine collide
    # (leaked TIME_WAIT sockets / slow teardown), while separate jobs
    # are isolated by construction.
    strategy:
      fail-fast: false
      matrix:
        opa-transport: [local, podman]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: apme
          POSTGRES_PASSWORD: apme
          POSTGRES_DB: apme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apme -d apme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install OPA binary
        env:
          OPA_VERSION: "1.17.1"
          OPA_SHA256: "3d4bb88482958d990351ec5d2f7558509992776bc473bc1b78d86d76cb993ca3"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/opa_linux_amd64_static \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /tmp/opa_linux_amd64_static" | sha256sum --check -
          sudo install -m 755 /tmp/opa_linux_amd64_static /usr/local/bin/opa
          opa version
      - name: Install Podman
        if: matrix.opa-transport == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Verify PostgreSQL reachability
        run: uvx --with-requirements ci/tox-requirements.txt tox -e postgres-check
      - name: Integration (OPA ${{ matrix.opa-transport }} path)
        run: uvx --with-requirements ci/tox-requirements.txt tox -e integration
        env:
          OPA_USE_PODMAN: ${{ matrix.opa-transport == 'podman' && '1' || '0' }}

  integration:
    runs-on: ubuntu-24.04
    needs: integration-matrix
    if: always()
    steps:
      - name: Verify integration matrix passed
        run: |
          if [[ "${{ needs.integration-matrix.result }}" != "success" ]]; then
            echo "::error::Integration matrix did not pass (${{ needs.integration-matrix.result }})"
            exit 1
          fi

  # Keep the `ui` job ID/name for required branch protection.
  # Shared BUI harness smoke only; real RHDH/Portal host acceptance stays #833.
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace and build shared BUI development harness
        run: uvx --with-requirements ci/tox-requirements.txt tox -e frontend-ci,frontend-dev-build
      - name: Serve built harness (API responses mocked by browser fixtures)
        run: |
          python -m http.server 8081 --bind 127.0.0.1 --directory frontend/backstage/dist-dev > /tmp/apme-workflow-harness.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/apme-workflow-harness.log
          exit 1
      - name: Chromium shared workflow harness smoke (not host certification)
        run: uvx --with-requirements ci/tox-requirements.txt tox -e ui-workflow-browser
        env:
          APME_WORKFLOW_UI_URL: http://127.0.0.1:8081

  test-ai-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx --with-requirements ci/tox-requirements.txt tox -e ai

  ui-workflow-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # This job installs from the repository root, so use its engine range.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: uvx --with-requirements ci/tox-requirements.txt tox -e ui-workflow-pack

  backstage-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: uvx --with-requirements ci/tox-requirements.txt tox -e frontend-ci,frontend-lint,frontend-unit,frontend-pack-smoke,frontend-release-pack-smoke,frontend-dev-build

  portal-packages:
    runs-on: ubuntu-24.04
    env:
      APME_PORTAL_CHECKOUT: ${{ github.workspace }}/.portal-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ansible/ansible-backstage-plugins
          ref: 6ab7fce5a37406c8958d1dc0291a4bc96eb1d3f5
          path: .portal-sdk
          persist-credentials: false
      - run: uvx --with-requirements ci/tox-requirements.txt tox -e frontend-ci,portal-sdk-install,portal-unit,portal-pack-smoke
      - run: uvx --with-requirements ci/tox-requirements.txt tox -e portal-unit -- --frontend
