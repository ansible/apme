# Multi-platform publish (ADR-063): native amd64 + arm64 builds, then
# imagetools merge into consumer tags on GHCR (and optional Quay).
# Image inventory: containers/ci/images.txt (single source of truth).
name: Container Images

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  QUAY_REGISTRY: quay.io

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - id: matrix
        run: |
          services="$(
            grep -vE '^[[:space:]]*(#|$)' containers/ci/images.txt \
              | grep -vx 'base' \
              | jq -R -s -c '
                  split("\n")
                  | map(select(length > 0))
                  | map({name: ., file: ("containers/" + . + "/Dockerfile")})
                '
          )"
          echo "services=${services}" >> "$GITHUB_OUTPUT"
          echo "Service matrix: ${services}"

  build-base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: containers/base/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          tags: ${{ env.GHCR_REGISTRY }}/${{ steps.owner.outputs.lc }}/apme-base:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max

  build-images:
    needs: [prepare, build-base]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        image: ${{ fromJson(needs.prepare.outputs.services) }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          platforms: linux/${{ matrix.arch.name }}
          provenance: false
          sbom: false
          tags: ${{ env.GHCR_REGISTRY }}/${{ steps.owner.outputs.lc }}/apme-${{ matrix.image.name }}:${{ github.sha }}-${{ matrix.arch.name }}
          build-args: |
            BASE_IMAGE=${{ env.GHCR_REGISTRY }}/${{ steps.owner.outputs.lc }}/apme-base:${{ github.sha }}-${{ matrix.arch.name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.name }},mode=max

  merge-manifests:
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      consumer_tags: ${{ steps.tags.outputs.tags }}
      owner_lc: ${{ steps.owner.outputs.lc }}
      quay_enabled: ${{ steps.quay-check.outputs.enabled }}
      quay_ns: ${{ steps.quay-check.outputs.ns }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: quay-check
        run: |
          if [ -n "$QUAY_USER" ] && [ -n "$QUAY_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "ns=${QUAY_ORG:-${{ steps.owner.outputs.lc }}}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_PASSWORD }}
          QUAY_ORG: ${{ secrets.QUAY_NAMESPACE }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        if: steps.quay-check.outputs.enabled == 'true'
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Tag list only — image name is a placeholder; merge script applies tags per image.
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ steps.owner.outputs.lc }}/apme-gateway
          tags: |
            type=sha
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - id: tags
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tag_lines < <(
            jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON" \
              | awk -F: '{print $NF}' \
              | sort -u
          )
          printf '%s\n' "${tag_lines[@]}" > /tmp/consumer-tags.txt
          echo "Consumer tags:"
          cat /tmp/consumer-tags.txt
          {
            echo 'tags<<EOF'
            printf '%s\n' "${tag_lines[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Merge multi-arch manifests
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          QUAY_REGISTRY: ${{ env.QUAY_REGISTRY }}
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          QUAY_ENABLED: ${{ steps.quay-check.outputs.enabled }}
          QUAY_NS: ${{ steps.quay-check.outputs.ns }}
          # Parallel imagetools create across images (merge was the wall-clock bottleneck).
          MERGE_PARALLELISM: "6"
        run: |
          args=(
            --owner "$OWNER_LC"
            --sha "${{ github.sha }}"
            --tags-file /tmp/consumer-tags.txt
          )
          if [ "$QUAY_ENABLED" = "true" ]; then
            args+=(--quay-ns "$QUAY_NS")
          fi
          ./containers/ci/merge-manifests.sh "${args[@]}"

  supply-chain:
    needs: merge-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Restore consumer tags from merge-manifests
        env:
          CONSUMER_TAGS: ${{ needs.merge-manifests.outputs.consumer_tags }}
        run: |
          printf '%s\n' "$CONSUMER_TAGS" > /tmp/consumer-tags.txt
          echo "Consumer tags:"
          cat /tmp/consumer-tags.txt

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        if: needs.merge-manifests.outputs.quay_enabled == 'true'
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
        with:
          enable-cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images and generate container SBOMs
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          QUAY_REGISTRY: ${{ env.QUAY_REGISTRY }}
          OWNER_LC: ${{ needs.merge-manifests.outputs.owner_lc }}
          QUAY_ENABLED: ${{ needs.merge-manifests.outputs.quay_enabled }}
          QUAY_NS: ${{ needs.merge-manifests.outputs.quay_ns }}
        run: |
          args=(
            --owner "$OWNER_LC"
            --tags-file /tmp/consumer-tags.txt
            --output-dir /tmp/sboms/containers
            --list-subjects /tmp/subjects.json
          )
          if [ "$QUAY_ENABLED" = "true" ]; then
            args+=(--quay-ns "$QUAY_NS")
          fi
          ./containers/ci/supply-chain.sh "${args[@]}"

      - name: Generate Python wheel SBOM
        run: ./containers/ci/generate-python-sbom.sh --output-dir /tmp/sboms/python

      - name: Upload release SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sboms-${{ github.sha }}
          path: /tmp/sboms/
          retention-days: 90

      - name: Write provenance subject matrix
        id: subjects
        run: |
          if [ ! -s /tmp/subjects.json ] || [ "$(jq 'length' /tmp/subjects.json)" -eq 0 ]; then
            echo "No provenance subjects produced" >&2
            exit 1
          fi
          echo "subjects=$(jq -c '.' /tmp/subjects.json)" >> "$GITHUB_OUTPUT"

  attest-provenance:
    needs: [merge-manifests, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJson(needs.supply-chain.outputs.subjects) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        if: needs.merge-manifests.outputs.quay_enabled == 'true'
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true
