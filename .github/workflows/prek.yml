---
name: prek

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  prek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # ADR-047 / lean-ci: install prek, then run the same tox gate developers use.
      - run: uv tool install prek
      - name: Lint
        run: |
          set -o pipefail
          uvx --with tox-uv tox -e lint 2>&1 | tee lint.log
      - name: Annotate lint failures
        if: failure()
        run: |
          # Surface hook errors as check annotations (readable via API without log auth).
          echo "::error::tox -e lint failed; excerpt follows"
          # Prefer hook failure lines, then compiler/mypy/ruff errors.
          {
            grep -E 'Failed$|Failed\s|error:|E[0-9]{3}|error\[|Found [0-9]+ error' lint.log || true
            echo '--- tail ---'
            tail -n 80 lint.log || true
          } | head -n 120 | while IFS= read -r line; do
            # Truncate to keep annotations usable
            echo "::error::${line:0:200}"
          done
