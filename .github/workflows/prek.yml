---
name: prek

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  prek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # ADR-047 / lean-ci: install prek, then run the same tox gate developers use.
      - run: uv tool install prek
      # Run openapi as its own tox env (matches historical prek.yml). Skipping the
      # nested openapi-check hook avoids false "files were modified" failures from
      # tox/setuptools side effects under prek's dirty-tree detection.
      - name: Lint
        run: |
          set -o pipefail
          SKIP=openapi-check uvx --with tox-uv tox -e lint 2>&1 | tee lint.log
      - name: OpenAPI check
        run: uvx --with tox-uv tox -e openapi -- --check
      - name: Annotate lint failures
        if: failure()
        run: |
          echo "::error::prek workflow failed"
          if [ -f lint.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          log = Path("lint.log").read_text(errors="replace").splitlines()
          for line in log[-80:]:
              print(f"::error::{line[:240]}")
          PY
          fi
