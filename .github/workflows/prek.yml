---
name: prek

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  prek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # ADR-047 / lean-ci: install prek, then run the same tox gate developers use.
      - run: uv tool install prek
      # Skip nested openapi-check (tox-in-prek dirty-tree false positives); run it
      # as a sibling tox env instead.
      - run: SKIP=openapi-check uvx --with tox-uv tox -e lint
      - run: uvx --with tox-uv tox -e openapi -- --check
