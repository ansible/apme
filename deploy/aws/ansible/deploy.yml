---
# Apply Terraform for deploy/aws/terraform then run smoke checks.
- name: Deploy APME AWS Phase 1 (Terraform apply + smoke)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    apme_deploy_aws_terraform_root: "{{ playbook_dir | dirname }}/terraform"
  tasks:
    - name: Apply Terraform root module (present)
      ansible.builtin.import_role:
        name: apme.deploy_aws.terraform_run
      vars:
        terraform_run_project_path: "{{ apme_deploy_aws_terraform_root }}"

    - name: Verify Terraform outputs (smoke)
      ansible.builtin.import_role:
        name: apme.deploy_aws.smoke_verify
      vars:
        smoke_verify_project_path: "{{ apme_deploy_aws_terraform_root }}"
