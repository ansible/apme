{{- if .Values.networkPolicy.enabled }}
# ADR-069: one Simple pod. Intra-pod traffic uses localhost (not subject to NP).
# Allow only external-facing HTTP ports for Ingress/Route / in-cluster API clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apme.fullname" . }}-engine
  labels:
    {{- include "apme.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  podSelector:
    matchLabels:
      {{- include "apme.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.ui.enabled }}
    - ports:
        - port: 8081
          protocol: TCP
    {{- end }}
{{- end }}
