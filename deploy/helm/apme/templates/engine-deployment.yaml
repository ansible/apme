{{- /* ADR-069: Simple all-in-one — single Deployment, replicas must be 1 */ -}}
{{- if ne (int .Values.engine.replicas) 1 }}
{{- fail "ADR-069 Simple topology: engine.replicas must be 1 (Gateway SQLite and Abbenay share this pod). Multi-replica requires a future topology ADR." }}
{{- end }}
{{- if ne (int .Values.gateway.replicas) 1 }}
{{- fail "ADR-069 Simple topology: gateway.replicas must be 1 (Gateway is a sidecar; SQLite is not multi-replica)." }}
{{- end }}
{{- if and .Values.ui.enabled (ne (int .Values.ui.replicas) 1) }}
{{- fail "ADR-069 Simple topology: ui.replicas must be 1 (UI is a sidecar in the Simple pod)." }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- fail "ADR-069 Simple topology: autoscaling.enabled must be false (HPA is not supported while Gateway/Abbenay share the pod)." }}
{{- end }}
{{- if .Values.abbenay.enabled }}
{{- include "apme.abbenay.validateLegacyKeys" . -}}
{{- include "apme.abbenay.validateProviderSchema" . -}}
{{- include "apme.abbenay.validateProviderNames" . -}}
{{- include "apme.abbenay.validateApiKeySecrets" . -}}
{{- include "apme.abbenay.validateProviderAuth" . -}}
{{- include "apme.abbenay.validateVertexADC" . -}}
{{- end }}
{{- $fullname := include "apme.fullname" . -}}
{{- $hasGcpCreds := or .Values.abbenay.gcp.serviceAccountKey .Values.abbenay.gcp.existingSecret -}}
{{- $hasVertexADC := false -}}
{{- if .Values.abbenay.enabled }}
{{- range $name, $provider := .Values.abbenay.providers }}
  {{- if and (eq $provider.engine "vertex-anthropic") (not $provider.baseUrl) (not $provider.apiKey) (not $provider.apiKeySecret) }}
    {{- $hasVertexADC = true -}}
  {{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-engine
  labels:
    {{- include "apme.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  {{- with .Values.engine.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "apme.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "apme.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apme.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.ui.enabled }}
      initContainers:
        - name: init-nginx-conf
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "ui" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sh", "-c", "cp -a /etc/nginx/conf.d/. /mnt/conf.d/"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /mnt/conf.d
      {{- end }}
      containers:
        # -- Primary orchestrator
        - name: primary
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "primary" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: APME_PRIMARY_LISTEN
              value: "0.0.0.0:50051"
            - name: NATIVE_GRPC_ADDRESS
              value: "127.0.0.1:50055"
            - name: OPA_GRPC_ADDRESS
              value: "127.0.0.1:50054"
            - name: ANSIBLE_GRPC_ADDRESS
              value: "127.0.0.1:50053"
            {{- if .Values.gitleaks.enabled }}
            - name: GITLEAKS_GRPC_ADDRESS
              value: "127.0.0.1:50056"
            {{- end }}
            {{- if .Values.collectionHealth.enabled }}
            - name: COLLECTION_HEALTH_GRPC_ADDRESS
              value: "127.0.0.1:50058"
            {{- end }}
            {{- if .Values.depAudit.enabled }}
            - name: DEP_AUDIT_GRPC_ADDRESS
              value: "127.0.0.1:50059"
            {{- end }}
            - name: APME_GALAXY_PROXY_URL
              value: "http://127.0.0.1:8765"
            - name: APME_REPORTING_ENDPOINT
              value: "127.0.0.1:50060"
            {{- if .Values.abbenay.enabled }}
            - name: APME_ABBENAY_ADDR
              value: "127.0.0.1:50057"
            - name: APME_ABBENAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: abbenay-token
            {{- if .Values.abbenay.aiModel }}
            - name: APME_AI_MODEL
              value: {{ .Values.abbenay.aiModel | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: sessions
              mountPath: /sessions
          resources:
            {{- toYaml .Values.engine.resources.primary | nindent 12 }}

        # -- Native validator
        - name: native
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "native" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_NATIVE_VALIDATOR_LISTEN
              value: "0.0.0.0:50055"
          readinessProbe:
            tcpSocket:
              port: 50055
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50055
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.engine.resources.native | nindent 12 }}

        # -- OPA validator
        - name: opa
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "opa" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_OPA_VALIDATOR_LISTEN
              value: "0.0.0.0:50054"
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.engine.resources.opa | nindent 12 }}

        # -- Ansible validator
        - name: ansible
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "ansible" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_ANSIBLE_VALIDATOR_LISTEN
              value: "0.0.0.0:50053"
            - name: APME_GALAXY_PROXY_URL
              value: "http://127.0.0.1:8765"
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: sessions
              mountPath: /sessions
              readOnly: true
          resources:
            {{- toYaml .Values.engine.resources.ansible | nindent 12 }}

        {{- if .Values.gitleaks.enabled }}
        # -- Gitleaks validator (optional)
        - name: gitleaks
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "gitleaks" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_GITLEAKS_VALIDATOR_LISTEN
              value: "0.0.0.0:50056"
          readinessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.engine.resources.gitleaks | nindent 12 }}
        {{- end }}

        {{- if .Values.collectionHealth.enabled }}
        # -- Collection Health validator
        - name: collection-health
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "collection-health" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_COLLECTION_HEALTH_VALIDATOR_LISTEN
              value: "0.0.0.0:50058"
          readinessProbe:
            tcpSocket:
              port: 50058
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50058
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: sessions
              mountPath: /sessions
              readOnly: true
          resources:
            {{- toYaml .Values.engine.resources.collectionHealth | nindent 12 }}
        {{- end }}

        {{- if .Values.depAudit.enabled }}
        # -- Dependency Audit validator
        - name: dep-audit
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "dep-audit" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_DEP_AUDIT_VALIDATOR_LISTEN
              value: "0.0.0.0:50059"
          readinessProbe:
            tcpSocket:
              port: 50059
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50059
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: sessions
              mountPath: /sessions
              readOnly: true
          resources:
            {{- toYaml .Values.engine.resources.depAudit | nindent 12 }}
        {{- end }}

        # -- Galaxy Proxy (PEP 503)
        - name: galaxy-proxy
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "galaxy-proxy" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: proxy-cache
              mountPath: /cache
          resources:
            {{- toYaml .Values.engine.resources.galaxyProxy | nindent 12 }}

        # -- Gateway (REST + gRPC reporting + SQLite)
        - name: gateway
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "gateway" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APME_PRIMARY_ADDRESS
              value: "127.0.0.1:50051"
            - name: APME_DB_PATH
              value: /data/apme.db
            - name: APME_GATEWAY_GRPC_LISTEN
              value: "0.0.0.0:50060"
            - name: APME_GATEWAY_HTTP_HOST
              value: "0.0.0.0"
            - name: APME_GATEWAY_HTTP_PORT
              value: "8080"
            {{- if .Values.abbenay.enabled }}
            # ADR-070: reverse-proxy Abbenay HTTP admin on loopback
            - name: APME_ABBENAY_HTTP_URL
              value: "http://127.0.0.1:8787"
            - name: APME_ABBENAY_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: abbenay-token
            {{- end }}
            {{- if .Values.collectionHealth.enabled }}
            - name: COLLECTION_HEALTH_GRPC_ADDRESS
              value: "127.0.0.1:50058"
            {{- end }}
            {{- if .Values.depAudit.enabled }}
            - name: DEP_AUDIT_GRPC_ADDRESS
              value: "127.0.0.1:50059"
            {{- end }}
            {{- if .Values.gateway.feedback.enabled }}
            - name: APME_FEEDBACK_ENABLED
              value: "true"
            - name: APME_FEEDBACK_GITHUB_REPO
              value: {{ required "gateway.feedback.githubRepo is required when gateway.feedback.enabled is true" .Values.gateway.feedback.githubRepo | quote }}
            - name: APME_FEEDBACK_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: feedback-github-token
            {{- end }}
          ports:
            - name: gateway-grpc
              containerPort: 50060
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/dashboard/summary
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/dashboard/summary
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: gateway-data
              mountPath: /data
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}

        {{- if .Values.ui.enabled }}
        # -- UI (nginx SPA)
        - name: ui
          image: {{ include "apme.image" (dict "registry" .Values.image.registry "name" "ui" "tag" .Values.image.tag "fallbackTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.ui.securityContext }}
          securityContext:
            {{- toYaml .Values.ui.securityContext | nindent 12 }}
          {{- end }}
          env:
            - name: APME_API_BACKEND
              value: "http://127.0.0.1:8080"
          ports:
            - name: ui-http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: ui-http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: ui-http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
        {{- end }}

        {{- if .Values.abbenay.enabled }}
        # -- Abbenay AI provider (loopback only; ADR-069)
        - name: abbenay
          image: {{ .Values.abbenay.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # ADR-070: gRPC for Primary + HTTP admin on loopback (no Service/hostPort 8787)
          args:
            - "web"
            - "--host"
            - "127.0.0.1"
            - "--port"
            - "8787"
            - "--grpc-host"
            - "127.0.0.1"
            - "--grpc-port"
            - "50057"
          env:
            - name: APME_ABBENAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: abbenay-token
            - name: ABBENAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: abbenay-token
            {{- if .Values.abbenay.aiModel }}
            - name: APME_AI_MODEL
              value: {{ .Values.abbenay.aiModel | quote }}
            {{- end }}
            - name: XDG_RUNTIME_DIR
              value: /tmp/abbenay-run
            - name: XDG_CONFIG_HOME
              value: /etc/abbenay-config
            {{- if $hasVertexADC }}
            {{- if $hasGcpCreds }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/service-account-key.json
            {{- end }}
            {{- with .Values.abbenay.gcp }}
            {{- if .project }}
            - name: GOOGLE_VERTEX_PROJECT
              value: {{ .project | quote }}
            {{- end }}
            {{- if .location }}
            - name: GOOGLE_VERTEX_LOCATION
              value: {{ .location | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $name, $provider := .Values.abbenay.providers }}
            {{- $envName := printf "ABBENAY_PROVIDER_%s" (upper (replace "-" "_" $name)) }}
            {{- if $provider.apiKey }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: provider-{{ $name }}-api-key
            {{- else if $provider.apiKeySecret }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $provider.apiKeySecret.name }}
                  key: {{ $provider.apiKeySecret.key }}
            {{- end }}
            {{- with $provider.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          ports:
            - name: abbenay-grpc
              containerPort: 50057
              protocol: TCP
          # Bind is 127.0.0.1 — kubelet tcpSocket to the pod IP cannot reach it.
          # Probe localhost inside the container instead (Abbenay image includes node).
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('net').createConnection(50057,'127.0.0.1').on('connect',function(c){c.end();process.exit(0)}).on('error',function(){process.exit(1)})"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('net').createConnection(50057,'127.0.0.1').on('connect',function(c){c.end();process.exit(0)}).on('error',function(){process.exit(1)})"
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.abbenay.resources | nindent 12 }}
          volumeMounts:
            - name: abbenay-config
              mountPath: /etc/abbenay-config/abbenay
              readOnly: true
            {{- if and $hasVertexADC $hasGcpCreds }}
            - name: gcp-credentials
              mountPath: /var/run/secrets/gcp
              readOnly: true
            {{- end }}
        {{- end }}

      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: {{ $fullname }}-sessions
        - name: proxy-cache
          persistentVolumeClaim:
            claimName: {{ $fullname }}-proxy-cache
        - name: gateway-data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-gateway-data
        {{- if .Values.ui.enabled }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        {{- end }}
        {{- if .Values.abbenay.enabled }}
        - name: abbenay-config
          configMap:
            name: {{ $fullname }}-abbenay-config
        {{- if and $hasVertexADC $hasGcpCreds }}
        - name: gcp-credentials
          secret:
            secretName: {{ if .Values.abbenay.gcp.serviceAccountKey }}{{ $fullname }}-gcp-credentials{{ else }}{{ .Values.abbenay.gcp.existingSecret }}{{ end }}
        {{- end }}
        {{- end }}
      {{- with .Values.engine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
