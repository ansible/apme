{{- if or .Values.postgres.enabled .Values.abbenay.enabled .Values.gateway.feedback.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apme.fullname" . }}-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "apme.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  {{- $postgresPassword := .Values.postgres.password }}
  {{- if not $postgresPassword }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "apme.fullname" .)) }}
  {{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "postgres-password") }}
  {{- $postgresPassword = (index $existingSecret.data "postgres-password") | b64dec }}
  {{- else }}
  {{- $postgresPassword = randAlphaNum 32 }}
  {{- end }}
  {{- end }}
  postgres-password: {{ $postgresPassword | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@127.0.0.1:5432/%s" (.Values.postgres.username | urlquery) ($postgresPassword | urlquery) (.Values.postgres.database | urlquery) | quote }}
  {{- end }}
  {{- if .Values.abbenay.enabled }}
  abbenay-token: {{ required "abbenay.token is required when abbenay.enabled is true" .Values.abbenay.token | quote }}
  {{- range $name, $provider := .Values.abbenay.providers }}
  {{- if $provider.apiKey }}
  provider-{{ $name }}-api-key: {{ $provider.apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.gateway.feedback.enabled }}
  feedback-github-token: {{ required "gateway.feedback.githubToken is required when gateway.feedback.enabled is true" .Values.gateway.feedback.githubToken | quote }}
  {{- end }}
{{- end }}
