{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apme.fullname" . }}-ui
  labels:
    {{- include "apme.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    {{- include "apme.selectorLabels" . | nindent 4 }}
    # ADR-069: UI is a sidecar on the Simple (engine) pod
    app.kubernetes.io/component: engine
{{- end }}
