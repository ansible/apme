# APME Helm Chart — default values (EAP / upstream Simple install)
# See ADR-054 + ADR-069. One Deployment co-locates engine + Gateway + UI +
# optional Abbenay on localhost (ADR-005). replicas must remain 1; HPA is off.

image:
  # Default registry to *pull* APME images from. CI always publishes to
  # ghcr.io/ansible and also publishes to quay.io/ansible when Quay
  # credentials are configured (see .github/workflows/container-images.yml).
  # Override for private mirrors / air-gapped registries.
  registry: quay.io/ansible
  # -- Image tag for all APME containers.
  # Pinned default shipped with this chart (must match Chart.yaml
  # appVersion). Corresponds to GitHub release v2026.8.6; Quay/GHCR
  # release tags omit the leading "v". Override with a SHA tag
  # (e.g. "sha-b7d1683") for unreleased builds.
  tag: "2026.8.6"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Simple pod: Engine + validators + Galaxy Proxy (+ Gateway/UI/Abbenay sidecars)
engine:
  # ADR-069: must be 1. Chart fails render if set higher.
  replicas: 1
  # Max concurrent Engine FixSession/Health RPCs (APME_ENGINE_MAX_RPCS).
  maxConcurrentRpcs: 16
  # Recreate avoids RWO PVC conflicts during single-replica rolling updates.
  strategy:
    type: Recreate
  resources:
    # Engine container resources. Override engine.resources.engine in values.
    engine:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    native:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    opa:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    ansible:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    gitleaks:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    collectionHealth:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    depAudit:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    galaxyProxy:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Placement for the Simple pod (ADR-069). Multi-replica / HPA unsupported.
  # gateway.*/ui.* nodeSelector|tolerations|affinity are unused — set engine.* only.
  topologySpreadConstraints: []

# -- Gitleaks is optional (requires external binary in the image)
gitleaks:
  enabled: true

# -- Collection Health validator
collectionHealth:
  enabled: true

# -- Dependency Audit validator
depAudit:
  enabled: true

# -- Gateway sidecar (REST + gRPC reporting + PostgreSQL) — ADR-069 Simple pod
gateway:
  # Retained for compatibility; must be 1 (Gateway is not a separate Deployment).
  replicas: 1
  # ``database.url`` or ``database.existingSecret`` is required. Gateway persistence
  # uses ``APME_DATABASE_URL`` (``postgresql+asyncpg://...``). URLs must use the
  # async driver (plain ``postgresql://`` is rejected).
  database:
    url: ""
    existingSecret:
      name: ""
      key: database-url
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  feedback:
    enabled: false
    githubRepo: ""
    githubToken: ""

# -- UI (nginx-served React SPA)
# Default: standalone SPA (ADR-030 Option A). For portal / backend-only
# installs (ADR-030 Option B), use the named profile:
#   -f values-portal.yaml
# or --set ui.enabled=false. See also values-standalone.yaml.
# The stock nginx image requires writable /var/run, /var/cache/nginx, and
# /etc/nginx/conf.d.  The chart mounts emptyDir volumes for these paths so
# the container works under OCP restricted-v2 SCC (arbitrary non-root UID).
# For a proper long-term fix, rebuild the image on nginxinc/nginx-unprivileged.
ui:
  enabled: true
  # Retained for compatibility; must be 1 (UI is a sidecar, not a Deployment).
  replicas: 1
  securityContext: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Abbenay AI provider (optional sidecar; binds 127.0.0.1 — no TLS)
# Abbenay is a unified AI daemon supporting 19+ LLM engines via the Vercel
# AI SDK.  Configure one or more providers below — the chart generates
# Abbenay's config.yaml and wires up secrets/volumes automatically.
# See docs/guides/ABBENAY_AI.md for GCP-specific setup.
abbenay:
  enabled: false
  # Daemon image (CalVer with v prefix). Independent of APME image.tag
  # (still 2026.8.6 until the next APME release). Engine source pins
  # abbenay-client==2026.8.7; published :2026.8.6 engine images still
  # ship 2026.8.6 of the client, which already speaks unix://.
  image: ghcr.io/redhat-developer/abbenay:v2026.8.7
  # -- Token APME uses to authenticate with Abbenay (required when enabled)
  token: ""
  # -- Override the default model APME selects (e.g. "vertex-claude/claude-sonnet-4-6")
  aiModel: ""
  # -- LLM providers.  Keys become provider names in Abbenay's config.yaml.
  # Each entry needs at minimum `engine` and `models`.
  # Auth options per provider (mutually exclusive):
  #   apiKey:       inline API key (Helm creates a Secret — avoid in production)
  #   apiKeySecret: reference to an existing K8s Secret { name, key }
  #   (omit both)   for engines that use ADC or need no auth (vertex-anthropic, ollama)
  #
  # Optional fields:
  #   baseUrl:   custom endpoint URL (proxies, self-hosted, Ollama, LM Studio)
  #   extraEnv:  list of additional env vars to inject [{name, value}]
  #
  # Examples — copy into providers: block below and adjust:
  #
  #   # OpenRouter (API-key engine)
  #   openrouter:
  #     engine: openrouter
  #     apiKey: "sk-or-..."            # OR use apiKeySecret below
  #     # apiKeySecret:
  #     #   name: my-openrouter-secret
  #     #   key: api-key
  #     models:
  #       anthropic/claude-sonnet-4-6: {}
  #       anthropic/claude-opus-4-6: {}
  #
  #   # Vertex AI Anthropic (GCP ADC — no API key needed)
  #   vertex-claude:
  #     engine: vertex-anthropic
  #     models:
  #       claude-sonnet-4-6: {}
  #       claude-sonnet-4-5: {}
  #       claude-haiku-4-5@20251001: {}
  #       claude-opus-4-6: {}
  #
  #   # Direct Anthropic API
  #   anthropic:
  #     engine: anthropic
  #     apiKeySecret:
  #       name: anthropic-credentials
  #       key: api-key
  #     models:
  #       claude-sonnet-4-6: {}
  #
  #   # Ollama (local, no auth)
  #   local-ollama:
  #     engine: ollama
  #     baseUrl: "http://ollama.default.svc:11434/v1"
  #     models:
  #       llama3.2: {}
  #
  #   # Corporate Vertex proxy (Bearer token auth)
  #   corp-vertex:
  #     engine: vertex-anthropic
  #     baseUrl: "https://your-proxy.example.com/models"
  #     apiKeySecret:
  #       name: vertex-proxy-token
  #       key: bearer-token
  #     models:
  #       claude-sonnet-4-6: {}
  #
  providers: {}

  # -- GCP credentials for vertex-anthropic engine (ADC authentication).
  # Only needed when a provider uses engine: vertex-anthropic without a
  # base_url/apiKey (i.e. direct Vertex AI, not a proxy).
  gcp:
    project: ""
    location: us-east5
    # -- Raw service-account JSON (Helm creates the Secret).
    # Prefer existingSecret in production to avoid putting keys in values files.
    serviceAccountKey: ""
    # -- Name of a pre-existing Secret containing a service-account-key.json key
    existingSecret: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# -- Persistent volume claims
persistence:
  sessions:
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  gateway:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  proxyCache:
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # -- Writable config volume for Abbenay runtime admin (ADR-070 / #498).
  # emptyDir by default (pod lifetime only — config and file-store secrets
  # reset on pod restart). Enable persistence for a PVC that survives
  # restarts (config.yaml + secrets.json when secretStore is file).
  abbenay:
    enabled: false
    size: 100Mi
    storageClass: ""
    accessMode: ReadWriteOnce

# -- Ingress for Gateway REST API and UI
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: apme.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: gateway
        - path: /
          pathType: Prefix
          service: ui
  tls: []

# -- OpenShift Route (alternative to Ingress for OCP clusters)
# When ui.enabled=true, route.host is required so the UI (/) and Gateway
# (/api) Routes share one hostname. When ui.enabled=false (portal), leave
# host empty to let OpenShift auto-assign the API Route hostname.
route:
  enabled: false
  host: ""
  annotations: {}
  tls:
    # Only "edge" termination is supported out of the box — backend services
    # (UI nginx, Gateway FastAPI) serve plain HTTP.  "reencrypt" and
    # "passthrough" require TLS-enabled backends and are not supported
    # without custom container builds.
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# -- HPA (unsupported under ADR-069 Simple topology — must stay false)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -- Network policies for inter-service traffic (OCP clusters with default-deny)
networkPolicy:
  enabled: false

# -- PodDisruptionBudgets (protect availability during node drains)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# -- Pod-level security context.
# Defaults to empty so OCP restricted-v2 SCC can inject its own UID/GID range.
# For vanilla Kubernetes set: podSecurityContext: { fsGroup: 1001 }
podSecurityContext: {}

# -- Container-level security context.
# Defaults to empty so OCP restricted-v2 SCC can inject its own UID/GID range.
# For vanilla Kubernetes set: securityContext: { runAsNonRoot: true, runAsUser: 1001 }
securityContext: {}
